org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.disallowKotlinSourceSets=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
# Detekt 1.23.x embeds Kotlin 2.1.0 which crashes on JDK 25 (CoreJrtFileSystem).
# Run the Gradle daemon itself on JDK 17 to avoid this.
# The build compilation still targets JVM 17 bytecode via compileOptions.